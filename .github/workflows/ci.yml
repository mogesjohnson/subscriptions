# BEST-OF-AI-DEV template v1. Cheap CI: one Linux job, cancelled when superseded.
# Do NOT make this workflow a required check: paths-ignore skips it for docs-only PRs,
# and a skipped required workflow leaves the PR pending forever. Require pr-checks instead.
# Other OSes run on demand (Actions > ci > Run workflow), not on every push.
name: ci

on:
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**', '.github/ISSUE_TEMPLATE/**']
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**', '.github/ISSUE_TEMPLATE/**']
  workflow_dispatch:
    inputs:
      os:
        description: Runner to test on
        type: choice
        options: [ubuntu-latest, windows-latest, macos-latest]
        default: ubuntu-latest

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ${{ inputs.os || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      # Actions are pinned to full commit SHAs; the comment names the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # REPO-SPECIFIC: the same commands AGENTS.md lists. Keep this the only definition.
      # npm ci needs a lockfile. Without one, install anyway and warn: commit the lockfile.
      - name: Install
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f package.json ]; then
            echo "::warning::No package-lock.json, so this install is not reproducible. Run npm install and commit the lockfile."
            npm install --no-audit --no-fund
          else
            echo "::warning::No package.json; the npm steps below do nothing."
          fi
      - run: npm run lint --if-present
        if: hashFiles('package.json') != ''
      - run: npm run typecheck --if-present
        if: hashFiles('package.json') != ''
      - run: npm test
        if: hashFiles('package.json') != ''
      - run: npm run build --if-present
        if: hashFiles('package.json') != ''
      # /REPO-SPECIFIC
